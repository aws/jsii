version: 2

updates:
  - package-ecosystem: nuget
    directory: '/packages/@jsii/dotnet-runtime/src'
    schedule:
      interval: weekly
    labels:
      - dependencies
      - language/dotnet
      - auto-approve

  - package-ecosystem: nuget
    directory: '/packages/@jsii/dotnet-runtime-test/test'
    schedule:
      interval: weekly
    labels:
      - dependencies
      - language/dotnet
      - auto-approve

  - package-ecosystem: pip
    directory: '/packages/@jsii/python-runtime'
    schedule:
      interval: weekly
    labels:
      - dependencies
      - language/python
      - auto-approve

  - package-ecosystem: pip
    directory: '/gh-pages'
    schedule:
      interval: weekly
    labels:
      - dependencies
      - language/python
      - auto-approve

  - package-ecosystem: pip
    directory: '/packages/jsii-pacmak/test/generated-code'
    schedule:
      interval: daily
    labels:
      - dependencies
      - language/python
      - auto-approve

  - package-ecosystem: pip
    directory: '/packages/jsii-pacmak/lib/targets/python'
    schedule:
      interval: daily
    labels:
      - dependencies
      - language/python
      - auto-approve
    ignore:
      - dependency-name: 'setuptools'

  - package-ecosystem: gomod
    directories:
      - '/packages/@jsii/go-runtime/jsii-runtime-go'
      - '/packages/@jsii/go-runtime-test/project'
    schedule:
      interval: daily
    labels:
      - dependencies
      - language/go
      - auto-approve
    ignore:
      - dependency-name: "go" # don't upgrad the golang version
      # Minor releases of `golang.org/x/tools` raise the `go` directive in go.mod
      # as a side effect (v0.50.0 requires `go >= 1.26.0`). That is a toolchain
      # ratchet the `go` ignore above cannot catch, and it breaks every CI job
      # until the pinned Go version is bumped by hand. Patch updates still flow.
      - dependency-name: golang.org/x/tools
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
      - dependency-name: github.com/aws/jsii-runtime-go
      - dependency-name: github.com/aws/jsii-runtime-go/*
      - dependency-name: github.com/aws/jsii/jsii-calc/go/*
    groups:
      go-deps:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: daily
    labels:
      - dependencies
      - auto-approve
